name: Java 25 core and Fabric 26.3 build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.2+10'
      - name: Verify wrapper provenance
        run: echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Core adversarial tests without Minecraft dependencies
        run: scripts/test-core.sh
      - name: Compile adapter, run core tests again and package exact target
        run: ./gradlew --no-daemon clean check build
      - uses: actions/upload-artifact@v4
        with:
          name: omperf-26.3-dev-build
          path: build/libs/*.jar
          if-no-files-found: error
